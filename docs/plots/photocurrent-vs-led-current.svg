<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Consolas, 'Courier New', monospace" font-size="13">
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>

  <!-- transition-region shaded band: Iph = 1e-5 to 1e-4 (log x = -5 to -4 -> x = 480 to 580) -->
  <rect x="480" y="40" width="100" height="360" fill="#ffe9b3" opacity="0.6"/>
  <text x="530" y="30" text-anchor="middle" fill="#8a6100" font-size="12">simulated transition region</text>

  <!-- axes -->
  <line x1="80" y1="400" x2="680" y2="400" stroke="#111" stroke-width="2"/>
  <line x1="80" y1="40" x2="80" y2="400" stroke="#111" stroke-width="2"/>

  <!-- x tick gridlines + labels (log decades -9..-3) -->
  <g stroke="#ccc" stroke-width="1">
    <line x1="80" y1="40" x2="80" y2="400"/>
    <line x1="180" y1="40" x2="180" y2="400"/>
    <line x1="280" y1="40" x2="280" y2="400"/>
    <line x1="380" y1="40" x2="380" y2="400"/>
    <line x1="480" y1="40" x2="480" y2="400"/>
    <line x1="580" y1="40" x2="580" y2="400"/>
    <line x1="680" y1="40" x2="680" y2="400"/>
  </g>
  <g fill="#111" text-anchor="middle">
    <text x="80" y="420">1nA</text>
    <text x="180" y="420">10nA</text>
    <text x="280" y="420">100nA</text>
    <text x="380" y="420">1&#956;A</text>
    <text x="480" y="420">10&#956;A</text>
    <text x="580" y="420">100&#956;A</text>
    <text x="680" y="420">1mA</text>
  </g>
  <text x="380" y="450" text-anchor="middle" fill="#111" font-weight="bold">Iph -- modeled photocurrent (log scale)</text>

  <!-- y tick gridlines + labels (0 to 0.075A) -->
  <g stroke="#eee" stroke-width="1">
    <line x1="80" y1="400" x2="680" y2="400"/>
    <line x1="80" y1="304" x2="680" y2="304"/>
    <line x1="80" y1="208" x2="680" y2="208"/>
    <line x1="80" y1="112" x2="680" y2="112"/>
  </g>
  <g fill="#111" text-anchor="end">
    <text x="72" y="404">0</text>
    <text x="72" y="308">0.02</text>
    <text x="72" y="212">0.04</text>
    <text x="72" y="116">0.06</text>
  </g>
  <text x="30" y="220" text-anchor="middle" fill="#111" font-weight="bold" transform="rotate(-90 30 220)">I(LED) -- amps</text>

  <!-- data curve, real 12-point sweep from sim/run.ps1 (see verification-log.md#simulation-results) -->
  <polyline fill="none" stroke="#c0392b" stroke-width="2.5"
    points="80,400 180,400 280,400 327.7,400 380,400 427.7,400 480,400 527.7,399.3 580,338.5 627.7,189.0 680,74.4"/>
  <g fill="#c0392b" stroke="none">
    <circle cx="80" cy="400" r="3.5"/>
    <circle cx="180" cy="400" r="3.5"/>
    <circle cx="280" cy="400" r="3.5"/>
    <circle cx="327.7" cy="400" r="3.5"/>
    <circle cx="380" cy="400" r="3.5"/>
    <circle cx="427.7" cy="400" r="3.5"/>
    <circle cx="480" cy="400" r="3.5"/>
    <circle cx="527.7" cy="399.3" r="3.5"/>
    <circle cx="580" cy="338.5" r="3.5"/>
    <circle cx="627.7" cy="189.0" r="3.5"/>
    <circle cx="680" cy="74.4" r="3.5"/>
  </g>

  <!-- dark point (Iph=0) annotation -- off the log axis by definition, called out separately -->
  <g stroke="#555" stroke-width="1" stroke-dasharray="4,3">
    <line x1="80" y1="400" x2="40" y2="400"/>
  </g>
  <circle cx="40" cy="400" r="3.5" fill="#555" stroke="none"/>
  <text x="10" y="435" fill="#555" font-size="11">dark</text>
  <text x="10" y="448" fill="#555" font-size="11">(Iph=0)</text>

  <text x="530" y="435" text-anchor="middle" fill="#111" font-size="12">~10&#956;A -- 100&#956;A</text>

  <text x="20" y="460" fill="#444" font-size="11">Real 12-point LTspice sweep (sim/light_alarm.cir), re-run and captured for this figure -- see docs/verification-log.md#simulation-results.</text>
</svg>
