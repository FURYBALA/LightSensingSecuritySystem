<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" font-family="Consolas, 'Courier New', monospace" font-size="14">
  <rect x="0" y="0" width="700" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <g stroke="#111" stroke-width="2" fill="none">

    <!-- VCC rail -->
    <line x1="80" y1="50" x2="680" y2="50"/>
    <text x="380" y="32" text-anchor="middle" fill="#111" stroke="none" font-weight="bold">VCC (node: VCC)</text>

    <!-- V1 source: rail down to a battery symbol, down to GND rail -->
    <line x1="90" y1="50" x2="90" y2="150"/>
    <line x1="70" y1="150" x2="110" y2="150" stroke-width="3"/>
    <line x1="78" y1="162" x2="102" y2="162" stroke-width="1.5"/>
    <line x1="90" y1="162" x2="90" y2="480"/>
    <text x="120" y="160" stroke="none" fill="#111">V1  9V</text>
    <text x="65" y="140" stroke="none" fill="#111" font-size="12">+</text>
    <text x="65" y="178" stroke="none" fill="#111" font-size="12">−</text>

    <!-- Photodiode branch: VCC -> cathode -> D_PD -> anode -> BASE node -->
    <line x1="210" y1="50" x2="210" y2="100"/>
    <!-- cathode bar (top, at VCC side) -->
    <line x1="185" y1="100" x2="235" y2="100" stroke-width="3"/>
    <!-- anode triangle pointing down (conventional current VCC->BASE when illuminated) -->
    <polygon points="185,100 235,100 210,140" fill="#111"/>
    <line x1="210" y1="140" x2="210" y2="210"/>
    <!-- incoming light arrows (photodiode convention) -->
    <line x1="150" y1="80" x2="178" y2="105" marker-end="url(#arrow)"/>
    <line x1="165" y1="68" x2="193" y2="93" marker-end="url(#arrow)"/>
    <!-- D_PD label block: ends at y=104, 42px clear of the Q1 label block starting y=146 -->
    <text x="250" y="68" stroke="none" fill="#111">D_PD</text>
    <text x="250" y="86" stroke="none" fill="#111">(reverse-biased;</text>
    <text x="250" y="104" stroke="none" fill="#111">Iph model here)</text>

    <!-- BASE node: label placed to the left, clear of all three wires (up/down/right) -->
    <circle cx="210" cy="210" r="3.5" fill="#111" stroke="none"/>
    <text x="195" y="214" text-anchor="end" stroke="none" fill="#111" font-weight="bold">BASE</text>

    <!-- R1 100k: BASE -> GND -->
    <rect x="192" y="225" width="36" height="90" rx="3"/>
    <line x1="210" y1="210" x2="210" y2="225"/>
    <line x1="210" y1="315" x2="210" y2="480"/>
    <text x="245" y="265" stroke="none" fill="#111">R1</text>
    <text x="245" y="281" stroke="none" fill="#111">100k</text>

    <!-- BASE -> transistor base (horizontal), well below the D_PD label block -->
    <line x1="210" y1="210" x2="445" y2="210"/>

    <!-- Q1 BC548BP transistor -->
    <circle cx="460" cy="230" r="42"/>
    <line x1="445" y1="195" x2="445" y2="265" stroke-width="3"/>
    <line x1="445" y1="207" x2="480" y2="192"/>
    <line x1="445" y1="253" x2="480" y2="268"/>
    <!-- emitter arrow (NPN: points away from base) -->
    <polygon points="473,261 480,268 473,272" fill="#111"/>
    <!-- transistor label block: in its own column to the RIGHT of the circle (x=520,
         circle's right edge is at x=502), well clear of the collector wire (x=480, which
         is entirely to this block's left) and of the D_PD block (which ends at x=364,
         y=104: separated from this block by 156px horizontally and 91px vertically) -->
    <text x="520" y="195" stroke="none" fill="#111" font-weight="bold">Q1 — BC548BP</text>
    <text x="520" y="213" stroke="none" fill="#111" font-size="13">C = VCC</text>
    <text x="520" y="231" stroke="none" fill="#111" font-size="13">B = BASE</text>
    <text x="520" y="249" stroke="none" fill="#111" font-size="13">E = EMIT</text>

    <!-- collector -> VCC rail -->
    <line x1="480" y1="192" x2="480" y2="50"/>

    <!-- emitter -> EMIT node -->
    <line x1="480" y1="268" x2="480" y2="310"/>
    <circle cx="480" cy="310" r="3.5" fill="#111" stroke="none"/>
    <!-- EMIT label: centered in the empty column directly below the node, clear of
         the up/left/right wires, the LED label/arrows to its left, and the buzzer box -->
    <text x="480" y="333" text-anchor="middle" stroke="none" fill="#111" font-weight="bold">EMIT</text>

    <!-- Branch A: EMIT -> D_LED -> RLED -> GND -->
    <line x1="480" y1="310" x2="360" y2="310"/>
    <line x1="360" y1="310" x2="360" y2="340"/>
    <!-- LED: anode triangle pointing down, cathode bar below -->
    <polygon points="335,340 385,340 360,380" fill="#111"/>
    <line x1="335" y1="380" x2="385" y2="380" stroke-width="3"/>
    <!-- outgoing light arrows (LED convention) -->
    <line x1="382" y1="350" x2="407" y2="325" marker-end="url(#arrow)"/>
    <line x1="395" y1="363" x2="420" y2="338" marker-end="url(#arrow)"/>
    <!-- D_LED label: upper-left of the symbol, clear of the arrows (which point up-right)
         and clear of the EMIT label (75px to its right) -->
    <text x="325" y="335" text-anchor="end" stroke="none" fill="#111">D_LED</text>
    <line x1="360" y1="380" x2="360" y2="395"/>
    <rect x="342" y="395" width="36" height="35" rx="3"/>
    <line x1="360" y1="430" x2="360" y2="480"/>
    <text x="382" y="408" stroke="none" fill="#111">RLED</text>
    <text x="382" y="424" stroke="none" fill="#111">100Ω</text>

    <!-- Branch B: EMIT -> RBUZZ (buzzer, modeled as resistor) -> GND -->
    <line x1="480" y1="310" x2="560" y2="310"/>
    <line x1="560" y1="310" x2="560" y2="340"/>
    <rect x="530" y="340" width="60" height="60" rx="4"/>
    <text x="543" y="366" stroke="none" fill="#111" font-size="12">BUZZER</text>
    <text x="543" y="382" stroke="none" fill="#111" font-size="11">(RBUZZ</text>
    <text x="543" y="396" stroke="none" fill="#111" font-size="11">500Ω equiv.)</text>
    <line x1="560" y1="400" x2="560" y2="480"/>

    <!-- GND rail -->
    <line x1="80" y1="480" x2="680" y2="480"/>
    <g stroke-width="2">
      <line x1="90" y1="480" x2="90" y2="492"/>
      <line x1="76" y1="492" x2="104" y2="492"/>
      <line x1="82" y1="500" x2="98" y2="500"/>
      <line x1="88" y1="508" x2="92" y2="508"/>
    </g>
    <text x="102" y="512" stroke="none" fill="#111" font-weight="bold">GND (node: 0)</text>

  </g>
  <text x="20" y="560" stroke="none" fill="#444" font-size="12">Reconstructed from sim/light_alarm.cir -- node names (VCC, BASE, EMIT, GND) match the netlist exactly. See docs/circuit-analysis.md.</text>
</svg>
