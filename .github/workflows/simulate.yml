name: Simulation

# Installs LTspice on a Windows runner and re-runs the real circuit
# simulation on every push/PR, checking that the two claims this repo
# actually makes still hold: the circuit is OFF in the dark and ON in
# bright (simulated) light.
on:
  push:
  pull_request:

jobs:
  simulate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install LTspice
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://ltspice.analog.com/download/26.0.2/LTspice64.msi" -OutFile "$env:RUNNER_TEMP\LTspice64.msi"
          Start-Process msiexec.exe -ArgumentList "/i `"$env:RUNNER_TEMP\LTspice64.msi`" /quiet /norestart" -Wait

      - name: DIAGNOSTIC - screenshot LTspice after 30s
        shell: powershell
        run: |
          $exe = "C:\Program Files\ADI\LTspice\LTspice.exe"
          if (-not (Test-Path $exe)) { $exe = Get-ChildItem "C:\Program Files","C:\Program Files (x86)" -Recurse -Filter LTspice.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName }
          Write-Output "Using: $exe"
          $cir = Join-Path $pwd "sim\light_alarm.cir"
          $proc = Start-Process -FilePath $exe -ArgumentList "-b","-ascii","`"$cir`"" -PassThru
          Start-Sleep -Seconds 30
          Write-Output "Still running: $(-not $proc.HasExited)"
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$pwd\diagnostic-screenshot.png")
          Get-Process | Where-Object { $_.MainWindowTitle -ne '' } | Select-Object Name, MainWindowTitle | Format-Table -AutoSize
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          Get-ChildItem "$pwd\sim\*.raw","$pwd\sim\*.log" -ErrorAction SilentlyContinue

      - name: Upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-screenshot
          path: diagnostic-screenshot.png
