name: Simulation

# Installs LTspice on a Windows runner and re-runs the real circuit
# simulation on every push/PR, checking that the two claims this repo
# actually makes still hold: the circuit is OFF in the dark and ON in
# bright (simulated) light.
on:
  push:
  pull_request:

jobs:
  simulate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install LTspice
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri "https://ltspice.analog.com/download/26.0.2/LTspice64.msi" -OutFile "$env:RUNNER_TEMP\LTspice64.msi"
          Write-Host "Downloaded MSI."
          Start-Process msiexec.exe -ArgumentList "/i `"$env:RUNNER_TEMP\LTspice64.msi`" /quiet /norestart /l*v `"$env:RUNNER_TEMP\ltspice_install.log`"" -Wait -PassThru | Out-Null
          Write-Host "msiexec finished."

      - name: DIAGNOSTIC - locate LTspice.exe (fast, non-recursive only)
        shell: powershell
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "--- Top-level Program Files ---"
          Get-ChildItem "C:\Program Files" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host "--- Top-level Program Files (x86) ---"
          Get-ChildItem "C:\Program Files (x86)" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host "--- Candidate paths ---"
          @(
            "C:\Program Files\ADI\LTspice\LTspice.exe",
            "C:\Program Files (x86)\ADI\LTspice\LTspice.exe",
            "C:\Program Files\LTC\LTspiceXVII\XVIIx64.exe",
            "$env:LOCALAPPDATA\Programs\ADI\LTspice\LTspice.exe"
          ) | ForEach-Object { Write-Host "$_ -> $(Test-Path $_)" }
          Write-Host "--- Tail of msiexec install log ---"
          Get-Content "$env:RUNNER_TEMP\ltspice_install.log" -Tail 40 -ErrorAction SilentlyContinue

      - name: Run simulation and check regression
        shell: powershell
        timeout-minutes: 2
        run: powershell -File sim/run.ps1 -Check

      - name: Upload simulation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: |
            sim/light_alarm.raw
            sim/light_alarm.log
